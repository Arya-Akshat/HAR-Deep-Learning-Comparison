[project]
name = "har-deep-learning"
version = "1.0.0"
description = "Human Activity Recognition using Deep Learning models (CNN-LSTM, CNN-BiLSTM-Attention, CNN-Transformer)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Core ML/DL frameworks
    "torch>=2.0.0",
    "numpy>=1.24.0",
    
    # Data manipulation & analysis
    "pandas>=2.0.0",
    
    # Scientific computing
    "scikit-learn>=1.3.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # Jupyter notebook support
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

cuda = [
    # For CUDA support - install separately based on CUDA version
    # pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
